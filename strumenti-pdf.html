<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>VEYLON · Strumenti PDF</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://hanxxxtgxofjkfdjegfe.supabase.co; script-src 'self' 'unsafe-inline' https://esm.sh https://cdn.skypack.dev https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://hanxxxtgxofjkfdjegfe.supabase.co; connect-src 'self' https://hanxxxtgxofjkfdjegfe.supabase.co https://plausible.io; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"/>
  <link rel="stylesheet" href="styles.css"/>
  <script defer data-domain="veylon.app" src="https://plausible.io/js/script.js"></script>
  <style>html.veylon-auth-pending body { visibility: hidden; }</style>
  <style>
    /* === Suite PDF — layout in stile Stirling-PDF home === */
    .sp-search { position: relative; max-width: 640px; margin: 28px auto 16px; }
    .sp-search input { width: 100%; padding: 14px 16px 14px 46px; font: inherit; font-size: 15px; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); color: var(--ink); transition: border-color 120ms; }
    .sp-search input:focus { outline: none; border-color: var(--seal); box-shadow: 0 0 0 3px oklch(70% 0.1 30 / 0.15); }
    .sp-search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
    .sp-pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 900px; margin: 0 auto 32px; padding: 0 16px; }
    .sp-pill { padding: 7px 14px; font: inherit; font-size: 13px; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); color: var(--ink-2); cursor: pointer; transition: all 120ms; white-space: nowrap; }
    .sp-pill:hover { border-color: var(--seal); color: var(--ink); }
    .sp-pill.is-active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .sp-pill-count { font-family: var(--mono); font-size: 11px; opacity: 0.7; margin-left: 4px; }
    .sp-section-h { font-family: var(--serif); font-size: 22px; margin: 32px 0 16px; color: var(--ink); }
    .sp-section-h em { color: var(--seal); font-style: italic; }
    .sp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .sp-grid.is-empty { display: block; padding: 48px 16px; text-align: center; color: var(--ink-3); font-family: var(--mono); font-size: 13px; }
    .sp-card { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 18px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); cursor: pointer; text-align: left; transition: all 150ms ease; font-family: inherit; min-height: 130px; position: relative; }
    .sp-card:hover { border-color: var(--seal); transform: translateY(-2px); box-shadow: 0 8px 24px -12px oklch(20% 0.05 30 / 0.25); }
    .sp-card-icon { width: 32px; height: 32px; color: var(--seal); flex-shrink: 0; }
    .sp-card-icon svg { width: 100%; height: 100%; }
    .sp-card-tag { position: absolute; top: 10px; right: 12px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; }
    .sp-card-name { font-family: var(--serif); font-size: 16px; line-height: 1.2; color: var(--ink); margin-top: 4px; }
    .sp-card-desc { font-size: 12.5px; line-height: 1.4; color: var(--ink-3); margin-top: 2px; }
    .sp-featured .sp-card { min-height: 160px; padding: 22px; }
    .sp-featured .sp-card-icon { width: 40px; height: 40px; }
    .sp-featured .sp-card-name { font-size: 18px; }
    @media (max-width: 640px) { .sp-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
    .sp-banner { padding: 14px 18px; border: 1px solid var(--rule); border-left: 3px solid var(--seal); border-radius: 6px; background: oklch(98% 0.01 80); font-size: 14px; line-height: 1.45; margin-bottom: 24px; }
    .sp-banner.is-warn { border-left-color: oklch(72% 0.16 50); }
    .sp-banner.is-err { border-left-color: oklch(58% 0.22 25); }
    .sp-banner.is-ok { border-left-color: oklch(60% 0.16 145); }
    .sp-modal-back { position: fixed; inset: 0; background: rgba(20, 20, 20, 0.55); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .sp-modal-back.is-open { display: flex; }
    .sp-modal { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; max-width: 1100px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px 28px 24px; }
    .sp-modal h3 { font-family: var(--serif); font-size: 22px; line-height: 1.15; margin: 0 0 6px; color: var(--ink); }
    .sp-modal p.sp-modal-desc { font-size: 14px; color: var(--ink-2); margin: 0 0 16px; }
    .sp-modal label { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; margin: 12px 0 4px; }
    .sp-modal input[type="file"], .sp-modal input[type="text"], .sp-modal input[type="password"], .sp-modal input[type="url"], .sp-modal input[type="number"], .sp-modal select, .sp-modal textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 6px; font: inherit; background: var(--paper); color: var(--ink); }
    .sp-modal input[type="checkbox"] { width: auto; margin-right: 6px; }
    .sp-modal .sp-check { display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 14px; color: var(--ink-2); text-transform: none; letter-spacing: 0; margin: 8px 0 0; }
    .sp-modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
    .sp-btn-primary { background: var(--seal); color: var(--paper); border: none; padding: 10px 18px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; }
    .sp-btn-primary:disabled { opacity: 0.5; cursor: wait; }
    .sp-btn-ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--rule); padding: 10px 18px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; }
    .sp-result { margin-top: 18px; padding: 14px 16px; background: oklch(98% 0.005 145); border: 1px solid var(--rule); border-radius: 6px; font-size: 13.5px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
    .sp-progress { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-top: 12px; }
    /* Guida «Cosa fa / File accettati / Come si usa» sotto ogni strumento (stile iLovePDF) */
    .sp-guida { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--rule); }
    .sp-guida[hidden] { display: none; }
    .sp-guida-card { border: 1px solid var(--rule); border-radius: 16px; background: var(--paper); padding: 20px 22px; min-width: 0; }
    .sp-guida-card.is-larga { grid-column: 1 / -1; }
    .sp-guida-h { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--ink); margin: 0 0 14px; }
    .sp-guida-ico { width: 36px; height: 36px; border-radius: 12px; background: var(--ink); color: var(--paper); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sp-guida-ico svg { width: 18px; height: 18px; }
    .sp-guida-card p { font-size: 15px; line-height: 1.55; color: var(--ink-2); margin: 0; }
    .sp-guida-formati { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .sp-guida-formati li { padding: 4px 10px; border-radius: 6px; background: oklch(95% 0.03 80); color: var(--ink); font-size: 12.5px; font-weight: 700; }
    .sp-guida-card p.sp-guida-nota { font-size: 13px; color: var(--ink-3); margin-top: 8px; }
    .sp-guida-passi { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .sp-guida-passi li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.55; color: var(--ink-2); }
    .sp-guida-num { width: 24px; height: 24px; border-radius: 50%; background: var(--seal); color: var(--paper); font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    @media (min-width: 640px) { .sp-guida { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1080px) { .sp-guida { grid-template-columns: 1.1fr 0.9fr 1.4fr; } .sp-guida-card.is-larga { grid-column: auto; } }
    /* Esito dei controlli Sì/No */
    .sp-esito { margin-top: 18px; padding: 28px 20px 24px; border: 1px solid var(--rule); border-radius: 16px; background: var(--paper); text-align: center; font-size: 15px; line-height: 1.5; color: var(--ink-2); }
    .sp-esito[hidden] { display: none; }
    .sp-esito::before { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; color: #fff; font-size: 28px; font-weight: 700; line-height: 1; box-shadow: 0 6px 16px oklch(0% 0 0 / 0.15); }
    .sp-esito.is-si::before { content: "\2713"; background: oklch(60% 0.16 145); }
    .sp-esito.is-no::before { content: "\2715"; background: oklch(58% 0.22 25); }
    .sp-esito strong { display: block; font-family: var(--serif); font-size: clamp(20px, 4vw, 26px); font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .sp-esito-ricomincia { margin-top: 14px; background: none; border: 0; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink-3); cursor: pointer; padding: 6px 12px; border-radius: 999px; }
    .sp-esito-ricomincia:hover, .sp-esito-ricomincia:focus-visible { color: var(--seal); outline: 2px solid transparent; text-decoration: underline; }
    @media (max-width: 640px) { .sp-grid { grid-template-columns: 1fr; } .sp-modal { padding: 20px; } }
  </style>
</head>
<body>

  <main class="col" style="padding: 40px 32px 96px;">

    <section class="head-row" style="text-align: center;">
      <div>
        <span class="section-num">§ Strumenti PDF</span>
        <h1 class="serif" style="font-size: clamp(32px, 3.8vw, 44px); line-height: 1.05; letter-spacing: -0.02em; margin: 14px 0 14px;">
          Suite <em class="serif-italic" style="color: var(--seal);">PDF certificata.</em>
        </h1>
        <p class="lede" style="font-size: 15.5px; margin: 0 auto; max-width: 560px;">
          <strong>92 strumenti</strong> per cifrare, convertire, organizzare, modificare. Dati in EU GDPR, in memoria, mai stoccati.
        </p>
      </div>
    </section>

    <section style="margin-top: 8px;">
      <div id="sp-status" class="sp-banner" hidden></div>

      <div class="sp-search">
        <span class="sp-search-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
        </span>
        <input id="sp-search-input" type="search" placeholder="Cerca uno strumento (es. comprimi, firma, word)..." autocomplete="off" />
      </div>

      <div class="sp-pills" id="sp-pills" role="tablist">
        <button class="sp-pill is-active" data-cat="all"         type="button">Tutti <span class="sp-pill-count">92</span></button>
        <button class="sp-pill"            data-cat="sicurezza"   type="button">Sicurezza <span class="sp-pill-count">10</span></button>
        <button class="sp-pill"            data-cat="conversione" type="button">Conversione <span class="sp-pill-count">23</span></button>
        <button class="sp-pill"            data-cat="pagine"      type="button">Organizza pagine <span class="sp-pill-count">17</span></button>
        <button class="sp-pill"            data-cat="modifica"    type="button">Modifica &amp; ritocco <span class="sp-pill-count">23</span></button>
        <button class="sp-pill"            data-cat="analisi"     type="button">Analisi <span class="sp-pill-count">8</span></button>
        <button class="sp-pill"            data-cat="moduli"      type="button">Moduli <span class="sp-pill-count">5</span></button>
        <button class="sp-pill"            data-cat="filtri"      type="button">Controlli <span class="sp-pill-count">6</span></button>
      </div>

      <div id="sp-featured-section">
        <h2 class="sp-section-h">In <em>primo piano</em></h2>
        <div id="sp-featured" class="sp-grid sp-featured"></div>
      </div>

      <h2 class="sp-section-h" id="sp-all-h">Tutti gli <em>strumenti</em></h2>
      <div id="sp-grid-all" class="sp-grid"></div>
    </section>

    <section style="margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--rule);">
      <p style="font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; color: var(--ink-3); margin: 0;">
        Powered by <a href="https://github.com/Stirling-Tools/stirling-pdf" target="_blank" rel="noopener" style="color: var(--ink-3); text-decoration: underline;">Stirling PDF</a> · MIT License · self-hosted by Veylon
      </p>
    </section>

  </main>

  <!-- MODAL FORM -->
  <div id="sp-modal-back" class="sp-modal-back" role="dialog" aria-modal="true" aria-labelledby="sp-modal-title">
    <div class="sp-modal">
      <h3 id="sp-modal-title">&mdash;</h3>
      <p class="sp-modal-desc" id="sp-modal-desc">&mdash;</p>
      <form id="sp-modal-form" enctype="multipart/form-data">
        <div id="sp-modal-fields"></div>
        <div class="sp-progress" id="sp-modal-progress" hidden></div>
        <div class="sp-esito" id="sp-modal-esito" role="status" hidden></div>
        <div class="sp-result" id="sp-modal-result" hidden></div>
        <div class="sp-modal-foot">
          <button type="button" class="sp-btn-ghost" id="sp-modal-close">Chiudi</button>
          <button type="submit" class="sp-btn-primary" id="sp-modal-submit">Esegui</button>
        </div>
      </form>
      <section class="sp-guida" id="sp-modal-guida" aria-label="Come usare lo strumento" hidden></section>
    </div>
  </div>

  <script type="module">
    import { supabase, requireSession } from "./_shared/supabase-client.js";
    import { renderAppShell } from "./_shared/app-shell.js";
    // Catalogo GENERATO da apps/web/src/data/strumentiPdfCatalog.ts (npm run genera:catalogo-pdf): testi e guida inclusi.
    import { STRUMENTI, CATEGORIE, IN_PRIMO_PIANO, MAX_MB } from "./_shared/strumenti-pdf-catalogo.js";
    import { tabellaDaPdf } from "./_shared/tabelle-pdf.js";

    const SUPABASE_URL = "https://hanxxxtgxofjkfdjegfe.supabase.co";
    const PROXY_PATH = "/functions/v1/pdf-stirling-proxy";

    // ---- Auth gate + sidebar ----
    document.documentElement.classList.add("veylon-auth-pending");
    const session = await requireSession("login.html");
    if (!session) { /* redirige; non eseguire il resto */ throw new Error("redirecting"); }
    await renderAppShell("strumenti");
    document.documentElement.classList.remove("veylon-auth-pending");

    // ---- Catalogo (fonte unica apps/web/src/data/strumentiPdfCatalog.ts) ----
    const CATS = CATEGORIE.map((c) => c.key);
    const TOOLS = {};
    for (const t of STRUMENTI) {
      (TOOLS[t.cat] ||= []).push({
        id: t.id, tag: t.tag, name: t.nome, desc: t.desc, endpoint: t.endpoint,
        expects: t.esce, fields: t.campi, guida: t.guida, controllo: t.controllo,
      });
    }
    // Nomi e numeri delle categorie sempre allineati al catalogo
    document.querySelectorAll(".sp-pill").forEach((btn) => {
      const c = CATEGORIE.find((x) => x.key === btn.dataset.cat);
      const n = btn.dataset.cat === "all" ? STRUMENTI.length : (TOOLS[btn.dataset.cat] || []).length;
      btn.innerHTML = escapeHtml(c ? c.label : "Tutti") + ' <span class="sp-pill-count">' + n + "</span>";
    });

    // ---- Icone (SVG inline Bootstrap-icons-like, MIT-compatible) ----
    // Mappa categoria -> path SVG fallback; map specifico per tool noti.
    const ICON_PATHS = {
      // Sicurezza
      "lock":         '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      "unlock":       '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9-3"/>',
      "shield":       '<path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3z"/>',
      "shield-check": '<path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/>',
      "shield-x":     '<path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3z"/><path d="m9 9 6 6m0-6-6 6"/>',
      "signature":    '<path d="M3 17s4-8 9-8 4 6 9 4"/><path d="M3 21h18"/>',
      "watermark":    '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 10h10M7 14h6"/>',
      "redact":       '<rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="9" width="10" height="2" fill="currentColor"/><rect x="7" y="13" width="6" height="2" fill="currentColor"/>',
      "eye":          '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
      "info":         '<circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/>',
      // Conversione
      "file":         '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
      "file-word":    '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><text x="7" y="17" font-size="6" font-family="Arial" font-weight="bold">W</text>',
      "file-excel":   '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><text x="8" y="17" font-size="6" font-family="Arial" font-weight="bold">X</text>',
      "file-text":    '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h6M8 17h6"/>',
      "file-image":   '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><circle cx="10" cy="13" r="1.5"/><path d="m7 18 3-3 2 2 4-4 2 2"/>',
      "file-code":    '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6m-9 4-2 2 2 2m4-4 2 2-2 2"/>',
      "image":        '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
      "convert":      '<path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/>',
      "html":         '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
      "markdown":     '<rect x="3" y="6" width="18" height="12" rx="1"/><path d="M6 14V9l2 2 2-2v5M14 9v5l-2-2m4 0-2 2"/>',
      "mail":         '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
      "book":         '<path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4V4z"/><path d="M8 4v16"/>',
      "vector":       '<rect x="3" y="3" width="6" height="6"/><rect x="15" y="15" width="6" height="6"/><path d="M9 6h6v3M6 9v6h3"/>',
      "comic":        '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="10" r="2"/><circle cx="15" cy="10" r="2"/><path d="M8 16s1.5 2 4 2 4-2 4-2"/>',
      // Pagine
      "merge":        '<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/><path d="M11 7h2v6"/>',
      "split":        '<path d="M3 12h7M14 12h7M10 7l4 5-4 5"/>',
      "rotate":       '<path d="M21 12a9 9 0 1 1-3.6-7.2"/><polyline points="21 4 21 9 16 9"/>',
      "crop":         '<path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/>',
      "scale":        '<path d="M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M3 8V5a2 2 0 0 1 2-2h3M21 16v3a2 2 0 0 1-2 2h-3"/>',
      "layers":       '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
      "overlay":      '<rect x="3" y="3" width="14" height="14" rx="1"/><rect x="7" y="7" width="14" height="14" rx="1" fill="var(--paper)"/>',
      "remove-page":  '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 14h6"/>',
      "rearrange":    '<path d="M3 6h13M3 12h13M3 18h13"/><path d="m18 9 3-3-3-3M18 21l3-3-3-3"/>',
      "bookmark":     '<path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',

    function applyFilter() {

          .map((t) => renderCard(t, true))
          .join("");
      }

      const filtered = ALL_TOOLS.filter((t) => {
        if (currentCat !== "all" && t._cat !== currentCat) return false;
        if (!q) return true;
        return (t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || (t.tag||"").toLowerCase().includes(q));

    const modalEsito = document.getElementById("sp-modal-esito");
    const modalGuida = document.getElementById("sp-modal-guida");
    const ICONE_GUIDA = {

      file: '<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="m9 15 2 2 4-4"/>',

    function renderGuida(tool) {

    function renderField(f) {

                <input type="file" id="f-${f.name}" name="${f.name}" accept="${escapeHtml(f.accept||"")}" ${mult} ${req}/>`;
      }
      if (f.kind === "text" || f.kind === "url" || f.kind === "password") {
        return `<label for="f-${f.name}">${escapeHtml(f.label)}${f.required ? " *" : ""}</label>
                <input type="${f.kind}" id="f-${f.name}" name="${f.name}" value="${escapeHtml(String(def))}" ${ph} ${req}/>`;

      }

        return `<label class="sp-check"><input type="checkbox" id="f-${f.name}" name="${f.name}" value="true" ${checked}/> ${escapeHtml(f.label)}</label>`;

    // ---- Submit ----
    modalForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentTool) return;
      modalSubmit.disabled = true; modalSubmit.textContent = "Elaborazione...";
      modalResult.hidden = true; modalResult.textContent = "";
      modalEsito.hidden = true; modalEsito.textContent = "";
      modalGuida.hidden = true;
      modalProgress.hidden = false; modalProgress.textContent = "Invio file al motore PDF...";

      try {
        const { data: sess } = await supabase.auth.getSession();
        const accessToken = sess?.session?.access_token;
        if (!accessToken) throw new Error("Sessione scaduta. Effettua di nuovo login.");

        const fd = new FormData();
        for (const f of currentTool.fields) {
          const el = modalForm.elements[f.name];
          if (!el) continue;
          if (f.kind === "file") {
            if (el.files && el.files.length) {
              for (const file of el.files) fd.append(f.name, file, file.name);
            }
          } else if (f.kind === "checkbox") {
            if (el.checked) fd.append(f.name, "true");
            else fd.append(f.name, "false");
          } else {
            if (el.value !== "" && el.value !== null) fd.append(f.name, el.value);
          }
        }

        // Stesso tetto del proxy: si avvisa prima di caricare 50 MB per niente.
        let totaleByte = 0;
        for (const [, v] of fd.entries()) if (v instanceof File) totaleByte += v.size;
        if (totaleByte > MAX_MB * 1048576) {
          showResult(`I file superano il limite di ${MAX_MB} MB (${(totaleByte / 1048576).toFixed(1)} MB).`);
          return;
        }

        // «PDF → Excel/CSV»: se il motore non trova tabelle con i bordi, la tabella si ricostruisce
        // qui nel browser (tabelle=browser: il server non ci prova, niente limiti di CPU o pagine).
        const formato = FORMATO_TABELLA[currentTool.endpoint] || null;
        const proxyUrl = `${SUPABASE_URL}${PROXY_PATH}?endpoint=${encodeURIComponent(currentTool.endpoint)}${formato ? "&tabelle=browser" : ""}`;
        const resp = await fetch(proxyUrl, {
          method: "POST",
          headers: { "Authorization": "Bearer " + accessToken },
          body: fd,
        });

        if (resp.status === 503 || resp.status === 429) {
          const j = await safeJson(resp);
          const attesa = Number(resp.headers.get("retry-after") || "");
          const quando = Number.isFinite(attesa) && attesa > 0
            ? (attesa < 120 ? `fra ${Math.ceil(attesa)} secondi` : `fra ${Math.ceil(attesa / 60)} minuti`)
            : "fra poco";
          showResult(resp.status === 429
            ? `Limite di richieste raggiunto. Riprova ${quando}.`
            : j?.error === "stirling_disabled"
              ? "Strumenti PDF temporaneamente non disponibili. Riprova fra qualche minuto."
              : `Il motore PDF è molto occupato. Riprova ${quando}.`);
          return;
        }
        if (resp.status === 204 && formato) {
          const el = modalForm.elements.fileInput;
          const file = el && el.files && el.files[0];
          if (!file) { showResult(MSG_NESSUNA_TABELLA); return; }
          modalProgress.hidden = false; modalProgress.textContent = "Ricostruisco la tabella dalle colonne del testo...";
          const pagine = modalForm.elements.pageNumbers ? modalForm.elements.pageNumbers.value : null;
          const ricostruita = await tabellaNelBrowser(file, formato, pagine || null);
          if (!ricostruita) { showResult(MSG_NESSUNA_TABELLA); return; }
          const blob = new Blob([ricostruita.bytes], { type: ricostruita.contentType });
          scaricaBlob(blob, ricostruita.nomeFile);
          showResult(`File pronto: ${ricostruita.nomeFile}\nDimensione: ${formatBytes(blob.size)}`);
          try { if (window.plausible) window.plausible("strumento_pdf_ok", { props: { tool: currentTool.id } }); } catch(_) {}
          return;
        }
        if (resp.status === 204) {
          if (currentTool.controllo) {
            mostraEsito(false, `Il controllo «${currentTool.name}» ha dato esito negativo con le impostazioni che hai scelto. Puoi cambiarle e premere di nuovo «Esegui».`);
          } else {
            showResult("Nessun risultato: il PDF non contiene elementi da estrarre.");
          }
          return;
        }
        if (!resp.ok) {
          const j = await safeJson(resp);
          const testi = { 402: "Quota mensile esaurita.", 413: `Il file supera il limite di ${MAX_MB} MB.`, 504: "Elaborazione troppo lunga: riprova con un file più piccolo." };
          showResult(testi[resp.status] || `Errore ${resp.status}: ${j?.message || j?.error || resp.statusText}`);
          return;
        }

        const ct = (resp.headers.get("content-type") || "").toLowerCase();
        if (ct.includes("application/json")) {
          const j = await resp.json();
          showResult(JSON.stringify(j, null, 2));
        } else {
          // binary -> download
          const blob = await resp.blob();
          const fname = filenameFrom(resp.headers.get("content-disposition")) || suggestedFilename(currentTool);
          scaricaBlob(blob, fname);
          if (currentTool.controllo) mostraEsito(true, `Il PDF è stato scaricato: ${fname} (${formatBytes(blob.size)}).`);
          else showResult(`File pronto: ${fname}\nDimensione: ${formatBytes(blob.size)}`);
          try { if (window.plausible) window.plausible("strumento_pdf_ok", { props: { tool: currentTool.id } }); } catch(_) {}
        }
      } catch (err) {
        console.error("[strumenti-pdf] submit error", err);
        showResult("Errore: " + (err?.message || String(err)));
      } finally {
        modalSubmit.disabled = false; modalSubmit.textContent = "Esegui";
        modalProgress.hidden = true;
        if (currentTool) modalGuida.hidden = false;
      }
    });

    function scaricaBlob(blob, nome) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = nome; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
    }

    // --- «PDF → Excel/CSV» con tabelle senza bordi: ricostruzione nel browser (tabelle-pdf.js) ---
    const FORMATO_TABELLA = { "/api/v1/convert/pdf/xlsx": "xlsx", "/api/v1/convert/pdf/csv": "csv" };
    const MSG_NESSUNA_TABELLA = "Nessuna tabella trovata. Se il PDF è una scansione (una foto delle pagine), passalo prima da «OCR (riconoscimento testo)» e poi riprova.";
    // Stessa versione di pdf.js dell'area utente (firma grafica e PDF → Excel)
    const PDFJS_ESM = "https://esm.sh/pdfjs-dist@4.7.76/legacy/build/pdf.mjs";
    const PDFJS_WORKER = "https://esm.sh/pdfjs-dist@4.7.76/legacy/build/pdf.worker.mjs";
    let pdfjsPronto = null;
    function caricaPdfJs() {
      if (!pdfjsPronto) {
        pdfjsPronto = import(PDFJS_ESM).then((m) => { m.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; return m; });
        pdfjsPronto.catch(() => { pdfjsPronto = null; });
      }
      return pdfjsPronto;
    }
    async function tabellaNelBrowser(file, formato, pagine) {
      const lib = await caricaPdfJs();
      const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      try { return await tabellaDaPdf(pdf, formato, file.name, pagine); }
      finally { try { await pdf.destroy(); } catch (_) {} }
    }

    function showResult(text) {
      modalResult.hidden = false; modalResult.textContent = text;
    }
    function showStatus(kind, msg) {
      const banner = document.getElementById("sp-status");
      banner.className = "sp-banner is-" + kind;
      banner.textContent = msg; banner.hidden = false;
    }
    async function safeJson(r) { try { return await r.json(); } catch { return null; } }
    function filenameFrom(disposition) {
      if (!disposition) return null;
      const m = /filename\*?=(?:UTF-8''|")?([^;"']+)/i.exec(disposition);
      return m ? decodeURIComponent(m[1].replace(/"/g,"")) : null;
    }
    function suggestedFilename(tool) {
      const ext = ({ pdf: "pdf", zip: "zip", docx: "docx", csv: "csv", image: "png", json: "json", txt: "txt", html: "html", xml: "xml", xlsx: "xlsx", epub: "epub", pptx: "pptx", ps: "ps" })[tool.expects] || "bin";
      const ts = new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
      return `veylon-${tool.id}-${ts}.${ext}`;
    }
    function formatBytes(b) {
      if (b < 1024) return `${b} B`;
      if (b < 1024*1024) return `${(b/1024).toFixed(1)} KB`;
      return `${(b/1024/1024).toFixed(2)} MB`;
    }
    function primaFrase(testo) {
      const m = /^(.+?[.!?])(\s|$)/.exec(testo);
      return m ? m[1] : testo;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
  </script>
